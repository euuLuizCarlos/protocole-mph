<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>InfoApp - Protocole MPH</title>
  <style>
    :root {
      --bg-principal: #0d1117;
      --bg-card: #161b22;
      --border-color: #30363d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --offer-gold: #f59e0b;
      --accent-blue: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent; /* Remove o destaque azul nativo ao tocar */
    }

    body {
      background-color: var(--bg-principal);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Topo do InfoApp */
    header {
      width: 100%;
      max-width: 900px;
      background-color: var(--bg-card);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px;
    }

    /* Container Principal */
    main {
      width: 100%;
      max-width: 900px;
      padding: 16px;
    }

    /* Banner Principal com Imagem */
    .banner-container {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
    }

    .banner-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* Grade de Módulos */
    .section-title {
      font-size: 1rem;
      margin-bottom: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
    }

    /* Cards de Módulos - Interatividade e Toque */
    .module-card {
      background-color: var(--bg-card);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      user-select: none;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }

    /* Efeito de Toque (Mobile First & Desktop Click) */
    .module-card:active {
      transform: scale(0.97);
      border-color: var(--accent-blue);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
    }

    /* Suporte a Hover exclusivo para computadores (com mouse) */
    @media (hover: hover) {
      .module-card:hover {
        transform: translateY(-4px);
        border-color: var(--accent-blue);
        box-shadow: 0 8px 20px rgba(56, 189, 248, 0.2);
      }
    }

    .module-thumb {
      width: 100%;
      height: 160px;
      background-color: #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-color);
      overflow: hidden;
    }

    .module-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .module-info {
      padding: 12px;
      text-align: center;
    }

    .module-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* Módulo de Oferta Especial */
    .module-card.offer-card {
      border: 2px solid var(--offer-gold);
      position: relative;
    }

    .module-card.offer-card:active {
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }

    @media (hover: hover) {
      .module-card.offer-card:hover {
        box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
      }
    }

    .offer-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      background-color: var(--offer-gold);
      color: #000;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 4px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      z-index: 2;
    }

    .module-card.offer-card .module-title {
      color: var(--offer-gold);
    }

    /* Ajuste fino para telas menores que 380px */
    @media (max-width: 380px) {
      .modules-grid {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .module-thumb {
        height: 130px;
      }
    }
  </style>
</head>
<body>

  <!-- Topo -->
  <header>
    <div class="brand">
      <span>INFOAPP</span>
    </div>
    <button class="icon-btn" aria-label="Notificações">🔔</button>
  </header>

  <!-- Conteúdo Principal -->
  <main>

    <!-- Banner Principal -->
    <div class="banner-container">
      <img src="Gemini_Generated_Image_wmg5zfwmg5zfwmg5.jfif" alt="Bienvenue ! Protocole MPH" class="banner-img" />
    </div>

    <div class="section-title">Módulos</div>

    <!-- Grade de Conteúdos -->
    <div class="modules-grid">

      <!-- OFERTA PRINCIPAL -->
      <a href="#oferta" class="module-card offer-card">
        <span class="offer-tag">Destaque</span>
        <div class="module-thumb">
          <img src="treino em casa.jpeg" alt="A Nossa Oferta Única" />
        </div>
        <div class="module-info">
          <div class="module-title">A Nossa Oferta Única</div>
        </div>
      </a>

      <!-- MÓDULOS ADICIONAIS -->
      <a href="#corpo" class="module-card">
        <div class="module-thumb">
          <img src="corpo.jpeg" alt="Seu Corpo" />
        </div>
        <div class="module-info">
          <div class="module-title">Seu Corpo</div>
        </div>
      </a>

      <a href="#alimentacao" class="module-card">
        <div class="module-thumb">
          <img src="alimentação.jpeg" alt="Alimentação" />
        </div>
        <div class="module-info">
          <div class="module-title">Alimentação</div>
        </div>
      </a>

      <a href="#movimento" class="module-card">
        <div class="module-thumb">
          <img src="movimento.jpeg" alt="Movimento" />
        </div>
        <div class="module-info">
          <div class="module-title">Movimento</div>
        </div>
      </a>

      <a href="#mentalidade" class="module-card">
        <div class="module-thumb">
          <img src="mentalidade.jpeg" alt="Mentalidade" />
        </div>
        <div class="module-info">
          <div class="module-title">Mentalidade</div>
        </div>
      </a>

    </div>
  </main>

</body>
</html>
