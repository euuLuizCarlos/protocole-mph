<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InfoApp - Protocole MPH</title>
  <style>
    :root {
      --bg-principal: #0d1117;
      --bg-card: #161b22;
      --border-color: #30363d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --offer-gold: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-principal);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Topo do InfoApp */
    header {
      width: 100%;
      max-width: 900px;
      background-color: var(--bg-card);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Container Principal */
    main {
      width: 100%;
      max-width: 900px;
      padding: 24px 16px;
    }

    /* Banner Principal com Imagem */
    .banner-container {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 32px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
    }

    .banner-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* Grade de Módulos */
    .section-title {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    /* Cards de Módulos */
    .module-card {
      background-color: var(--bg-card);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .module-card:hover {
      transform: translateY(-4px);
      border-color: #3b82f6;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.15);
    }

    .module-thumb {
      width: 100%;
      height: 180px;
      background-color: #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-color);
      overflow: hidden;
    }

    .module-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .module-info {
      padding: 16px;
      text-align: center;
    }

    .module-title {
      font-weight: 600;
      font-size: 1rem;
    }

    /* Módulo de Oferta Especial */
    .module-card.offer-card {
      border: 2px solid var(--offer-gold);
      position: relative;
    }

    .module-card.offer-card:hover {
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.25);
    }

    .offer-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: var(--offer-gold);
      color: #000;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      z-index: 2;
    }

    .module-card.offer-card .module-title {
      color: var(--offer-gold);
    }
  </style>
</head>
<body>

  <!-- Topo -->
  <header>
    <div class="brand">
      <span>INFOAPP</span>
    </div>
    <div>🔔</div>
  </header>

  <!-- Conteúdo Principal -->
  <main>

    <!-- Banner Principal -->
    <div class="banner-container">
      <img src="Gemini_Generated_Image_wmg5zfwmg5zfwmg5.jfif" alt="Bienvenue ! Protocole MPH" class="banner-img" />
    </div>

    <div class="section-title">Módulos</div>

    <!-- Grade de Conteúdos -->
    <div class="modules-grid">

      <!-- OFERTA PRINCIPAL -->
      <a href="#oferta" class="module-card offer-card">
        <span class="offer-tag">Destaque</span>
        <div class="module-thumb">
          <img src="treino em casa.jpeg" alt="A Nossa Oferta Única" />
        </div>
        <div class="module-info">
          <div class="module-title">A Nossa Oferta Única</div>
        </div>
      </a>

      <!-- MÓDULOS ADICIONAIS -->
      <a href="#corpo" class="module-card">
        <div class="module-thumb">
          <img src="corpo.jpeg" alt="Seu Corpo" />
        </div>
        <div class="module-info">
          <div class="module-title">Seu Corpo</div>
        </div>
      </a>

      <a href="#alimentacao" class="module-card">
        <div class="module-thumb">
          <img src="alimentação.jpeg" alt="Alimentação" />
        </div>
        <div class="module-info">
          <div class="module-title">Alimentação</div>
        </div>
      </a>

      <a href="#movimento" class="module-card">
        <div class="module-thumb">
          <img src="movimento.jpeg" alt="Movimento" />
        </div>
        <div class="module-info">
          <div class="module-title">Movimento</div>
        </div>
      </a>

      <a href="#mentalidade" class="module-card">
        <div class="module-thumb">
          <img src="mentalidade.jpeg" alt="Mentalidade" />
        </div>
        <div class="module-info">
          <div class="module-title">Mentalidade</div>
        </div>
      </a>

    </div>
  </main>

</body>
</html>
